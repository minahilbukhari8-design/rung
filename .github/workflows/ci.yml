name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rung
          POSTGRES_PASSWORD: rung_local_dev
          POSTGRES_DB: rung_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rung:rung_local_dev@localhost:5432/rung_test?schema=public
      TEST_DATABASE_URL: postgresql://rung:rung_local_dev@localhost:5432/rung_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rung/db exec prisma migrate deploy
      - run: pnpm --filter @rung/db exec prisma generate
      - run: pnpm -r typecheck
      - run: pnpm --filter @rung/domain test
      - run: pnpm --filter @rung/db test
      - run: pnpm --filter @rung/api test
      - run: pnpm --filter @rung/mobile test
